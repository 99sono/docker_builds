# Docker Compose template for the final assembled development image (Layer 04)
#
# Purpose:
# - Minimal template for running the dev environment image built by this stack.
# - Provides SSH access and optional environment variables for coding agents.
#
# How to use:
# 1. Build the images via scripts/build_all.sh (or individual layer build.sh scripts)
# 2. Copy .env.example to .env and fill in any values you need
# 3. docker compose up -d
# 4. Connect via SSH: ssh -p 2222 developer@localhost

version: "3.9"

services:
  dev:
    image: development-level04-project-stubs:${IMAGE_VERSION:-1.0.0}

    container_name: dev-environment
    ports:
      - "2222:22"

    # Persist a workspace directory on the host (optional)
    # volumes:
    #   - ./workspace:/home/developer/dev

    # Coding agent environment variables (optional).
    # Most agents (Cline, OpenCode, Antigravity) have their own auth flows.
    # OPENAI_API_KEY is passed for OpenAI Codex as an alternative to `codex login`.
    # Copy .env.example to .env and fill in your values.
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

    # Override command if you need a different behavior:
    # command: ["sleep", "infinity"]

    # Uncomment for TTY/interactive defaults
    # tty: true
    # stdin_open: true
